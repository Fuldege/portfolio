function bindTreeCase(){
 const tree=treeCopy[language];
 const leaves=[...$('detail').querySelectorAll('[data-leaf]')];
 const panel=$('tree-leaf-panel');
 $('detail').querySelectorAll('[data-photo]').forEach(button=>button.onclick=()=>{
  const photo=button.querySelector('img');
  $('photo-caption').textContent=photo.alt;
  $('preview-photo').alt=photo.alt;
  $('preview-photo').src=photo.src;
  $('photo-dialog').showModal();
 });
 let lastTask=-1;
 function select(index){
  selectedLeaf=index;
  leaves.forEach((leaf,i)=>leaf.setAttribute('aria-expanded',i===index));
  panel.hidden=index<0;
  if(index<0)return;
  const [title,body]=tree.leaves[index];
  panel.innerHTML=`<button type="button" class="preview-x tree-leaf-close" aria-label="${tree.close}">×</button><h2 tabindex="-1">${title}</h2><p>${body}</p>
   ${index===1?`<button type="button" id="tree-draw">${tree.draw}</button><p class="tree-task" id="tree-task"></p>`:''}`;
  panel.querySelector('.tree-leaf-close').onclick=()=>{select(-1);leaves[index].focus();};
  const draw=$('tree-draw');
  if(draw)draw.onclick=()=>{
   lastTask=lastTask<0?Math.floor(Math.random()*tree.tasks.length):
    (lastTask+1+Math.floor(Math.random()*(tree.tasks.length-1)))%tree.tasks.length;
   $('tree-task').textContent=tree.tasks[lastTask];
  };
 }
 leaves.forEach((leaf,i)=>leaf.onclick=()=>{
  select(selectedLeaf===i?-1:i);
  if(!panel.hidden)panel.scrollIntoView({block:'nearest'});
 });
 select(selectedLeaf);
}

function loopDistance(route){
 return route.slice(1).reduce((length,[x,y],i)=>
  length+Math.hypot((x-route[i][0])*1.5,y-route[i][1]),0);
}

function pathFrames(path){
 const total=loopDistance(path);
 let distance=0;
 return path.map(([x,y],i)=>{
  if(i)distance+=loopDistance([path[i-1],path[i]]);
  return {left:x+'%',top:y+'%',offset:Math.min(1,distance/total)};
 });
}

function pathAroundLoop(loop,from,to){
 function trace(direction){
  const path=[loop[from]];
  for(let i=from;i!==to;){
   i=(i+direction+loop.length)%loop.length;
   path.push(loop[i]);
  }
  return path;
 }
 const forward=trace(1),backward=trace(-1);
 return loopDistance(forward)<=loopDistance(backward)?forward:backward;
}
