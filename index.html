  polygon(surf,'#3e526d');
  const lower=coast.map(([x,y])=>[x,y+10]);
  polygon(lower,'#181b36');
  coast.forEach(([x,y],i)=>{
   const [a,b]=coast[(i+1)%coast.length];
   if(a>x)return;
   polygon([[x,y],[a,b],[a,b+8],[x,y+8]],i%2?'#464758':'#5c5363');
   block((x+a)/2,(y+b)/2+5,4,2,'#766574');
  });
  polygon(coast,'#75917a');
  const inner=coast.map(([x,y])=>[Math.round(cx+(x-cx)*.92),Math.round(cy+(y-cy)*.92)]);
  polygon(inner,'#667f70');
  for(let i=0;i<100;i++){
   const x=50+(i*29)%281,y=52+(i*37)%118;
   if(((x-192)/145)**2+((y-107)/60)**2<.94)block(x,y,i%3?2:4,1,i%2?'#809582':'#5c756a');
  }
  ground(cx-10,cy-15,73,27,['#8da084','#536f66']);
  ground(cx-23,cy-24,40,15,['#9baa8d','#6b8374']);
  polygon([[cx+12,cy-13],[cx+31,cy-19],[cx+54,cy-11],[cx+48,cy-4],[cx+23,cy-4]],'#445f75');
  block(cx+27,cy-10,17,1,'#87a6a1');
  block(cx+22,cy-7,11,1,'#748f9b');
  trail([...loop,loop[0]]);
  for(const [dx,dy] of [[-53,-19],[-42,-33],[-25,-37],[-13,-30],[10,-20],[53,-9],[59,-20],[-41,7],[12,11]]){
   tree(cx+dx,cy+dy,['#779b80','#4f6d66','#a9ad88'],true);
  }
 }else{
  const edge=[[8,47],[17,29],[30,17],[56,13],[75,19],[88,33],[92,50],[84,67],[69,79],[45,84],[25,79],[12,65]].map(pos);
  polygon(edge.map(([x,y])=>[x,y+9]),colors[district][1]);
  polygon(edge,colors[district][0]);
  ground(cx,cy,53,17,colors[district]);
  trail([...loop,loop[0]]);
 }
 for(const {id,points} of stops){
  const pins=harbor?points.slice(-1):points;
  pins.forEach((point,index)=>{
   const [x,y]=pos(point);
   const lit=point===active;
   landmark(x-6,y-6,id,colors[id],harbor&&id==='oalmr'?1:index,lit);
   if(id!=='hkonnect'){
    tree(x+20,y-4,['#7c987a','#526a67','#afab83'],true);
    block(x+6,y+3,5,2,'#d09887');
   }
   block(x+19,y-8,2,8,'#59475d');block(x+18,y-10,4,3,lit?'#fff3c4':'#a68e95');
  });
 }
 if(!harbor){
  for(const [dx,dy] of [[-22,-7],[15,-5],[-30,10]]){
   tree(cx+dx,cy+dy,['#789279','#52676a','#a6aa7e'],true);
  }
 }
}

function paintAvatar(canvas){
 const palette={o:'#352b43',h:'#50384c',l:'#785264',s:'#efbd97',e:'#513b4d',c:'#8ba99e',a:'#c0c7a9',b:'#635476',p:'#d5a08e'};
 const rows=[
  '...oooooo...',
  '..ohllllho..',
  '.ohhhhhhhho.',
  '.ohhssshhho.',
  '.ohseseshho.',
  '.ohssssshho.',
  '.ohhssshhho.',
  '.ohhccchhho.',
  '.ohcacaccho.',
  '.ohccccccco.',
  '.ohcaaaccao.',
  '..occcccco..',
  '...obbbbo...',
  '...obobbo...',
  '...op.opo...',
  '...oo.ooo...'
 ];
 const ctx=canvas.getContext('2d');
 rows.forEach((row,y)=>Array.from(row).forEach((pixel,x)=>{
  if(pixel=='.')return;
  ctx.fillStyle=palette[pixel];
  ctx.fillRect(x,y,1,1);
 }));
}
