/* Project panels borrow the stepped frames and palette of the island maps. */
.detail{
 --case-surface:#23263c;--case-inset:#191c2e;--case-edge:#595877;
 --case-shadow:#0e1020;--case-text:#d8d6e8;--case-heading:#fff0d9;
 --pixel-corner:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px));
 margin-bottom:68px;
}
.detail[data-project="oalmr"],.detail[data-project="value-tree"]{
 --case-surface:#233631;--case-inset:#192b29;--case-edge:#526b5d;--case-text:#dbe7d7;
}
.detail[data-project="hkonnect"]{--case-surface:#222f44;--case-inset:#192438;--case-edge:#506682}
.detail[data-project="research"]{--case-surface:#252f44;--case-inset:#1b2335;--case-edge:#536782}
.detail[data-project="writing"]{--case-surface:#32273e;--case-inset:#271d33;--case-edge:#6b5678}
.detail .detail-toolbar{
 margin-bottom:22px;background:var(--case-inset);border:2px solid var(--case-edge);
 border-radius:0;box-shadow:4px 4px var(--case-shadow);
}
.detail-toolbar a{border-radius:0}
.detail-jumps{scrollbar-color:var(--case-edge) var(--case-inset)}
.detail-toolbar>a{background:var(--case-surface);box-shadow:inset 0 -2px var(--case-edge)}
.detail-toolbar a[aria-current="location"]{box-shadow:inset 0 -3px #16192755}
.detail-jumps a:not(:first-child)::before{
 content:"";width:6px;height:6px;margin-right:7px;border:1px solid var(--detail-accent);flex:none;
}
.detail-jumps a[aria-current="location"]::before{border-color:var(--case-inset);background:var(--case-inset)}
.detail .case-hero,.detail .tree-hero{
 position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
 align-items:center;gap:clamp(16px,3.5vw,44px);min-height:0;
 padding:clamp(24px,4vw,44px);border:0;border-radius:0;
 background:var(--case-surface);color:var(--case-heading);clip-path:var(--pixel-corner);
}
.detail :is(.case-hero,.tree-hero)::before{
 content:"";position:absolute;inset:0;pointer-events:none;border:2px solid var(--case-edge);
 border-top:4px solid var(--detail-accent);clip-path:var(--pixel-corner);
}
.detail :is(.case-hero,.tree-hero) small{
 display:inline-flex;align-items:center;gap:10px;color:var(--detail-accent);font-size:14px;line-height:1.5;
}
.detail :is(.case-hero,.tree-hero) small::before,.detail :is(.case-chapter,.geo-topic,.tree-story,.campus-clubs,.hk-content,.case-demo) h2::before{
 content:"";flex:none;display:inline-block;width:8px;height:8px;background:var(--detail-accent);
 box-shadow:3px 3px var(--case-shadow);
}
.case-hero-copy,.detail .tree-hero-copy{min-width:0;padding:0}
.detail :is(.case-hero,.tree-hero) h1{
 font:850 clamp(34px,5.3vw,72px)/1.04 system-ui,sans-serif;letter-spacing:-.06em;
 margin:13px 0 16px;text-shadow:3px 3px var(--case-shadow);overflow-wrap:anywhere;
}
.detail .case-hero h2{color:var(--detail-accent);font-size:clamp(18px,2.25vw,26px);line-height:1.35;margin:0 0 11px}
.detail :is(.case-hero,.tree-hero) p{color:var(--case-text);line-height:1.68}
.case-scene{
 display:block;width:100%;height:auto;image-rendering:pixelated;background:var(--case-inset);
 border:4px solid var(--case-edge);box-shadow:6px 6px var(--case-shadow);
}
.detail .case-content,.detail .hk-content,.detail .tree-content{
 display:grid;gap:18px;background:none;border:0;border-radius:0;color:var(--case-text);padding:0;
 margin:22px 0 0;
}
.detail :is(.tree-case,.paper){border:0;border-radius:0;background:none;overflow:visible}
.detail .tree-case{color:var(--case-text)}
.detail :is(.case-chapter,.hk-content>section,.geo-topic,.geo-publication,.tree-leaf-panel,.tree-story>section,.tree-photos,.tree-crux,.campus-clubs,.case-demo){
 margin:0;border:2px solid var(--case-edge);border-radius:0;padding:clamp(17px,3.3vw,34px);
 background:var(--case-surface);color:var(--case-text);box-shadow:4px 4px var(--case-shadow);
}
.detail :is(.case-chapter,.geo-topic,.tree-story,.campus-clubs,.hk-content,.case-demo) h2{
 display:flex;align-items:baseline;gap:11px;
}
.detail :is(.case-content,.hk-content,.tree-content) :is(h2,h3,dt){color:var(--case-heading)}
.detail :is(.case-chapter p,.case-roles dd,.case-visual figcaption,.tree-photo-grid figcaption,.publication-authors,.campus-case .case-chapter small,.campus-experience small){color:var(--case-text)}
.detail :is(.case-roles,.campus-account,.tree-leaf-panel button,.campus-works figure,.campus-experience,.hk-route li,.case-track li){
 background:var(--case-inset);color:var(--case-text);border:1px solid var(--case-edge);border-radius:0;
}
.detail :is(.case-roles div,.hk-work dl div,.demo-audit){border-color:var(--case-edge)}
.detail .case-track li::before{background:var(--detail-accent)}
.detail .case-track :is(.is-scope,.is-ai li:last-child){color:var(--case-inset);background:var(--detail-accent);font-weight:750}
.detail .case-track :is(.is-scope,.is-ai li:last-child)::before{background:var(--case-inset)}
.detail :is(.campus-experience strong,.hk-route strong,.geo-publication h2,.geo-publication a,.demo-state){color:var(--detail-accent)}
.detail :is(.campus-account a,.detail-links a,.hk-site){border-radius:0;background:var(--detail-accent);color:var(--case-inset);box-shadow:3px 3px var(--case-shadow)}
.detail :is(.case-demo button,.campus-works .photo-open){border-radius:0}
.detail .campus-works .photo-open img{background:var(--case-inset)}
.detail .campus-works figcaption strong{color:var(--case-heading)}
.detail :is(.tree-story h2,.tree-photos h2){font:750 clamp(22px,3vw,34px)/1.18 system-ui,sans-serif}
.detail .tree-story{gap:18px}
.detail .tree-crux{border-left:5px solid var(--detail-accent)}
.detail .tree-canopy{

 paintAvatar(walker.querySelector('canvas'));
 let lastStep=0, districtMove;
 function showStep(i,animate=false){
  nodes.forEach((node,j)=>node.setAttribute('aria-pressed',j===i));
  updateNote(i);
  districtMove?.cancel();
  const path=pathAroundLoop(districtLoop,stationIndices[lastStep],stationIndices[i]);
  const [x,y]=positions[i];
  walker.style.left=x+'%';
  walker.style.top=y+'%';
  const arrive=()=>{
   lastStep=i;
   drawDistrict(positions[i]);
  };
  if(animate&&path.length>1&&!reducedMotion.matches){
   drawDistrict();
   districtMove=walker.animate(pathFrames(path),{duration:Math.min(1300,loopDistance(path)*14),easing:'linear'});
   districtMove.onfinish=arrive;
  }else{
   arrive();
  }
 }
 function updateNote(i){

 }

function bindTreeCase(){
 const tree=treeCopy[language];
 const leaves=[...$('detail').querySelectorAll('[data-leaf]')];
 const panel=$('tree-leaf-panel');
 let lastTask=-1;
 function select(index){
  selectedLeaf=index;
  leaves.forEach((leaf,i)=>leaf.setAttribute('aria-expanded',i===index));
  panel.hidden=index<0;
  if(index<0)return;
  const [title,body]=tree.leaves[index];
  panel.innerHTML=`<button type="button" class="preview-x tree-leaf-close" aria-label="${tree.close}">×</button><h2 tabindex="-1">${title}</h2><p>${body}</p>
   ${index===1?`<button type="button" id="tree-draw">${tree.draw}</button><p class="tree-task" id="tree-task"></p>`:''}`;
  panel.querySelector('.tree-leaf-close').onclick=()=>{select(-1);leaves[index].focus();};
  const draw=$('tree-draw');
  if(draw)draw.onclick=()=>{
   lastTask=lastTask<0?Math.floor(Math.random()*tree.tasks.length):
    (lastTask+1+Math.floor(Math.random()*(tree.tasks.length-1)))%tree.tasks.length;
   $('tree-task').textContent=tree.tasks[lastTask];
  };
 }
 leaves.forEach((leaf,i)=>leaf.onclick=()=>{
  select(selectedLeaf===i?-1:i);
  if(!panel.hidden)panel.scrollIntoView({block:'nearest'});
 });
 select(selectedLeaf);
}

function loopDistance(route){
 return route.slice(1).reduce((length,[x,y],i)=>
  length+Math.hypot((x-route[i][0])*1.5,y-route[i][1]),0);
}

function pathFrames(path){
 const total=loopDistance(path);
 let distance=0;
 return path.map(([x,y],i)=>{
  if(i)distance+=loopDistance([path[i-1],path[i]]);
  return {left:x+'%',top:y+'%',offset:Math.min(1,distance/total)};
 });
}

function pathAroundLoop(loop,from,to){
 function trace(direction){
  const path=[loop[from]];
  for(let i=from;i!==to;){
   i=(i+direction+loop.length)%loop.length;
   path.push(loop[i]);
  }
  return path;
 }
 const forward=trace(1),backward=trace(-1);
 return loopDistance(forward)<=loopDistance(backward)?forward:backward;
}

  for(let i=0;i<Math.floor(r*.68);i++){
   const dx=(i*37+11)%(r*2)-r,dy=(i*29+9)%(d*2)-d;

 function trail(points){

   for(let j=0;j<=steps;j++)block(x+(a-x)*j/steps-3,y+(b-y)*j/steps-2,7,5,'#594f60');

 const harbor=canvas.id==='harbor-map';

 const [cx,cy]=pos(center);
 if(harbor){

 for(const {id,points} of stops){

 if(!harbor){
