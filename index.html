const loopIndex = new Map(islandLoop.flatMap(([, ,id],i)=>id?[[id,i]]:[]));
const loopStops = islandLoop.filter(([, ,id])=>id).map(([, ,id])=>id);
const stationPoint = id => islandLoop[loopIndex.get(id)];

function loopDistance(route){
 return route.slice(1).reduce((length,[x,y],i)=>
  length+Math.hypot((x-route[i][0])*1.5,y-route[i][1]),0);
}

function pathFrames(path){
 const total=loopDistance(path);
 let distance=0;
 return path.map(([x,y],i)=>{
  if(i)distance+=loopDistance([path[i-1],path[i]]);
  return {left:x+'%',top:y+'%',offset:Math.min(1,distance/total)};
 });
}

function pathAroundLoop(loop,from,to){
 function trace(direction){
  const path=[loop[from]];
  for(let i=from;i!==to;){
   i=(i+direction+loop.length)%loop.length;
   path.push(loop[i]);
  }
  return path;
 }
 const forward=trace(1),backward=trace(-1);
 return loopDistance(forward)<=loopDistance(backward)?forward:backward;
}

function walk(index,openProject=true){
 selected=(index+projects.length)%projects.length;
 const destination=projects[selected];
 const end=stationPoint(destination.id);
 buttons.forEach((button,i)=>button.setAttribute('aria-pressed',i===selected));

 movement?.cancel();
 movement=null;

  movement=null;

  if(openProject&&!$('home').hidden)openJourney();
  if(openProject&&street.scrollWidth>street.clientWidth){
   street.scrollTo({left:end[0]/100*street.scrollWidth-street.clientWidth/2,behavior:reducedMotion.matches?'instant':'smooth'});
  }

 if(!openProject||reducedMotion.matches||arrival<0||selected===arrival){finish();return;}
 drawIsland();
 const frames=pathAroundLoop(islandLoop,loopIndex.get(projects[arrival].id),loopIndex.get(destination.id));
 movement=walker.animate(pathFrames(frames),{duration:Math.min(1600,Math.max(450,loopDistance(frames)*14))});
 movement.onfinish=finish;
}

 const pictures=p.image?`<figure><img src="${p.image}" alt="${t('treePhoto')}"><figcaption>${t('treePhoto')}</figcaption></figure>`:'';
 const gallery=p.image?`<div class="gallery">${[2,3,4].map(n=>`<a href="tree${n}.png"><img src="tree${n}.png" alt="${t('treePhoto')} ${n}"></a>`).join('')}</div>`:'';
 const ankerCase=p.id==='anker'?`<div class="case-sections">${caseSections[language].map(([heading,body])=>`<section><h3>${heading}</h3><p>${body}</p></section>`).join('')}</div><section class="case-demo" id="case-demo"></section>`:'';
 $('detail').innerHTML=`<a href="#">${t('back')}</a><h1 tabindex="-1">${p.title}</h1><small>${p.kind}</small>
  <section class="paper">${pictures}<h2>${p.description}</h2><p>${p.body}</p>
  ${p.role?`<h3>${t('myWork')}</h3><p>${p.role}</p>`:''}
  ${p.link?`<a href="${p.link}">${p.linkText} ↗</a>`:''}${p.extra?` · <a href="${p.extra}">Xiaohongshu ↗</a>`:''}
  ${gallery}${ankerCase}</section>`;
 if(ankerCase)renderDemo();
 if(navigate){
  walk(projects.findIndex(project=>project.id===(p.id==='retail'?'anker':p.id)),false);
  window.scrollTo(0,0);
  $('detail').querySelector('h1').focus({preventScroll:true});
 }
}
$('contact-open').onclick=()=>$('contact').showModal();
const colors={
 'value-tree':['#628466','#4b5e50','#dfaa78','#816071'],
 hkonnect:['#9a836f','#625367','#91a7ad','#557995'],
 anker:['#657789','#434c65','#789cbf','#4978a8'],
 writing:['#886b81','#584963','#b98d93','#a36e83'],
 oalmr:['#778666','#566254','#d2ac99','#a87587'],
 research:['#74928f','#4d606c','#afbfcb','#8e9dbc']
};
function paintWorld(canvas,stops,center,loop,active){
 const ctx=canvas.getContext('2d');
 const {width:w,height:h}=canvas;
 const pos=([x,y])=>[Math.round(w*x/100),Math.round(h*y/100)];
 function block(x,y,width,height,color){
  ctx.fillStyle=color;
  ctx.fillRect(Math.round(x),Math.round(y),width,height);
 }
 function polygon(vertices,color){
  const ys=vertices.map(p=>p[1]);
  for(let y=Math.ceil(Math.min(...ys));y<Math.max(...ys);y++){
   const edges=[];
   for(let i=0;i<vertices.length;i++){
    const [ax,ay]=vertices[i],[bx,by]=vertices[(i+1)%vertices.length];
    if((ay<=y&&by>y)||(by<=y&&ay>y))edges.push(ax+(y-ay)*(bx-ax)/(by-ay));
   }
   edges.sort((a,b)=>a-b);
   for(let i=0;i+1<edges.length;i+=2){
    block(edges[i],y,Math.round(edges[i+1])-Math.round(edges[i]),1,color);
   }
  }
 }
 function ground(x,y,r,d,palette){
  const top=[[x-r,y],[x-r+9,y-5],[x-11,y-d],[x+8,y-d],[x+r-8,y-5],[x+r,y],[x+10,y+d],[x-9,y+d]];
  const base=top.map(([a,b])=>[a,b+9]);
  polygon(top.map(([a,b])=>[a+3,b+12]),'#1d2037');
  polygon(base,'#363449');
  const front=top.slice(5).concat([top[0]]);
  for(let i=0;i<front.length-1;i++){
   const [a,b]=front[i],[c,e]=front[i+1];
   polygon([[a,b],[c,e],[c,e+9],[a,b+9]],i===0?'#39384c':palette[1]);
   for(let j=4;j<Math.abs(c-a);j+=8){
    const t=j/Math.abs(c-a);
    block(a+(c-a)*t,b+(e-b)*t+3,3,2,'#55536a');
   }
  }
  polygon(top,palette[0]);
  polygon([[x-r+5,y],[x-10,y-d+2],[x+8,y-d+2],[x+r-8,y-4],[x+8,y-d+4],[x-9,y-d+4]],'#b6a58a');
  for(let i=0;i<Math.floor(r*.68);i++){
   const dx=(i*37+11)%(r*2)-r,dy=(i*29+9)%(d*2)-d;
   if(Math.abs(dx)/r+Math.abs(dy)/d>.83)continue;
   block(x+dx,y+dy,i%5===0?4:2,1,i%3===0?'#ffffff24':'#28263d30');
  }
 }
 function trail(points){
  for(let i=1;i<points.length;i++){
   const [x,y]=pos(points[i-1]),[a,b]=pos(points[i]);
   const steps=Math.max(Math.abs(a-x),Math.abs(b-y),1);
   for(let j=0;j<=steps;j++)block(x+(a-x)*j/steps-3,y+(b-y)*j/steps-2,7,5,'#594f60');
   for(let j=0;j<=steps;j++)block(x+(a-x)*j/steps-2,y+(b-y)*j/steps-2,5,3,j%4===0?'#aa9282':'#d1ae94');
  }
 }
 function tree(x,y,palette,small=false){
  const r=small?6:11;
  block(x-r,y-1,r*2+5,3,'#2d314655');
  block(x-1,y-12,3,13,'#594253');
  polygon([[x-r,y-9],[x-r,y-17],[x-5,y-22],[x+4,y-23],[x+r,y-17],[x+r,y-10],[x+5,y-7],[x-5,y-7]],palette[1]);
  polygon([[x-r,y-14],[x-6,y-21],[x+4,y-24],[x+r,y-17],[x+4,y-12],[x-5,y-11]],palette[0]);
  block(x-5,y-20,5,2,palette[2]);
  block(x+3,y-17,4,2,palette[2]);
 }
 function landmark(x,y,id,palette,index,lit){
  const windowLight=lit?'#ffe6a5':'#987e88';
  const shade='#332e44';
  block(x-17,y-1,42,4,'#2b2b4055');
  if(id==='value-tree'||(id==='oalmr'&&index===0)){
   tree(x,y,lit?['#dfa066','#9e746e','#ffda9c']:['#b67968','#826071','#edbb84']);
   if(lit){
    block(x-9,y-12,2,2,'#fff1c0');
    block(x+4,y-9,3,2,'#ffd28a');
    block(x-2,y-16,2,2,'#fff1c0');
   }
   block(x-14,y-5,7,3,'#e4bb92');block(x+8,y-3,5,3,'#e5b58b');
   return;
  }
  if(id==='hkonnect'){
   block(x-19,y-3,42,5,'#5b434e');
   for(let i=-18;i<23;i+=5)block(x+i,y-4,4,3,'#c29478');
   polygon([[x-15,y-8],[x+16,y-8],[x+12,y],[x-10,y]],'#423751');
   block(x-10,y-15,8,7,'#bb8968');block(x-8,y-16,4,2,'#e8b782');
   if(lit)block(x-18,y-5,38,1,'#ffd793');
   if(index!==1){
    block(x+2,y-15,10,8,'#afbbc0');block(x+3,y-14,6,3,lit?'#fff0ad':'#54627e');
    block(x+6,y-20,2,6,'#e8b782');
   }else{
    block(x+1,y-13,6,6,'#a57461');block(x+9,y-14,7,7,'#dbb278');
   }
   if(lit)block(x-7,y-13,3,3,'#fff0ad');
   return;
  }
  const retail=id==='anker', campus=id==='oalmr', studio=id==='writing';
  const r=campus?18:retail?16:13;
  const height=retail?16:20;
  block(x-r,y-height,2*r,height,palette[2]);
  block(x-r,y-3,2*r,3,'#665476');
  polygon([[x+r,y-height],[x+r+7,y-height-6],[x+r+7,y-6],[x+r,y]],palette[1]);
  polygon([[x-r-2,y-height],[x-r+6,y-height-8],[x+r+8,y-height-8],[x+r+2,y-height]],palette[3]);
  block(x-r-1,y-height,2*r+3,2,shade);
  if(retail){
   block(x-r+2,y-height+4,2*r-4,9,'#34475e');
   for(let i=x-r+4;i<x+r-2;i+=6)block(i,y-height+5,4,7,lit?'#ffe8a7':'#83adaf');
   block(x-r-2,y-height+2,2*r+4,2,'#c1b2d6');
  }else{
   for(let i=x-r+3;i<x+r-2;i+=7){
    block(i-1,y-height+5,6,7,'#60506d');
    block(i,y-height+6,4,5,windowLight);
   }
  }
  if(campus){
   block(x-5,y-27,10,11,'#ae89a0');block(x-2,y-25,4,3,'#f3c59d');
   block(x-7,y-28,14,2,'#715776');
  }
  if(studio){
   block(x-10,y-29,4,5,'#a8828b');block(x-12,y-29,7,2,'#684f6e');
   block(x-r+2,y-3,6,3,'#e0a594');
  }
  if(id==='research'&&index===0){
   polygon([[x-10,y-21],[x-9,y-27],[x-6,y-32],[x+5,y-32],[x+9,y-28],[x+10,y-21]],'#bdbed5');
   block(x-5,y-30,4,3,lit?'#ffedba':'#e8d4dd');block(x+3,y-28,5,6,'#5d5b78');
  }
  block(x-3,y-8,6,8,lit?'#ffdc95':shade);
  block(x-4,y,9,2,lit?'#ffe8a5':'#d6b192');
 }
 const harbor=canvas.id==='harbor-map';
 const district=harbor?'harbor':stops[0].id;
 const sky={
  harbor:['#222743','#3c4a68','#596985'],
  'value-tree':['#252c40','#354a47','#66816d'],
  hkonnect:['#252c4d','#3a4c70','#7d7991'],
  anker:['#242940','#3e4963','#646681'],
  writing:['#352842','#55405c','#ae7887'],
  oalmr:['#2d304a','#4b5470','#917c8c'],
  research:['#232944','#384865','#757d9a']
 }[district];
 block(0,0,w,h,sky[0]);
 if(district==='harbor'||district==='hkonnect'){
  for(let i=0;i<145;i++){
   const x=(i*57+13)%w,y=(i*37+11)%h;
   block(x,y,4+i%11,1,i%8===0?sky[2]:sky[1]);
   if(i%9===0)block(x+5,y+2,5,1,sky[1]);
  }
 }else if(district==='anker'||district==='writing'){
  block(0,0,w,h*.38,sky[1]);
  for(let x=0;x<w;x+=12){
   const height=8+(x*7)%31;
   block(x,h*.38-height,10,height,sky[0]);
   if(x%24===0)block(x+3,h*.38-height+5,2,2,sky[2]);
  }
 }else{
  polygon([[0,h*.52],[0,h*.28],[w*.14,h*.12],[w*.30,h*.31],[w*.48,h*.08],[w*.71,h*.32],[w*.89,h*.14],[w,h*.28],[w,h*.52]],sky[1]);
  for(let i=0;i<36;i++)block((i*67+9)%w,(i*19+8)%Math.floor(h*.34),i%5===0?3:1,1,sky[2]);
 }
 const [cx,cy]=pos(center);
 if(harbor){
  const coast=[[8,55],[11,38],[21,26],[36,15],[53,14],[70,19],[84,29],[91,49],[90,61],[79,75],[59,85],[38,86],[21,80],[11,68]].map(pos);
  const surf=coast.map(([x,y])=>[Math.round(cx+(x-cx)*1.055),Math.round(cy+(y-cy)*1.10)+8]);
  polygon(surf,'#3e526d');
  const lower=coast.map(([x,y])=>[x,y+10]);
  polygon(lower,'#181b36');
  coast.forEach(([x,y],i)=>{
   const [a,b]=coast[(i+1)%coast.length];
   if(a>x)return;
   polygon([[x,y],[a,b],[a,b+8],[x,y+8]],i%2?'#464758':'#5c5363');
   block((x+a)/2,(y+b)/2+5,4,2,'#766574');
  });
  polygon(coast,'#75917a');
  const inner=coast.map(([x,y])=>[Math.round(cx+(x-cx)*.92),Math.round(cy+(y-cy)*.92)]);
  polygon(inner,'#667f70');
  for(let i=0;i<100;i++){
   const x=50+(i*29)%281,y=52+(i*37)%118;
   if(((x-192)/145)**2+((y-107)/60)**2<.94)block(x,y,i%3?2:4,1,i%2?'#809582':'#5c756a');
  }
  ground(cx-10,cy-15,73,27,['#8da084','#536f66']);
  ground(cx-23,cy-24,40,15,['#9baa8d','#6b8374']);
  polygon([[cx+12,cy-13],[cx+31,cy-19],[cx+54,cy-11],[cx+48,cy-4],[cx+23,cy-4]],'#445f75');
  block(cx+27,cy-10,17,1,'#87a6a1');
  block(cx+22,cy-7,11,1,'#748f9b');
  trail([...loop,loop[0]]);
  for(const [dx,dy] of [[-53,-19],[-42,-33],[-25,-37],[-13,-30],[10,-20],[53,-9],[59,-20],[-41,7],[12,11]]){
   tree(cx+dx,cy+dy,['#779b80','#4f6d66','#a9ad88'],true);
  }
 }else{
  const edge=[[8,47],[17,29],[30,17],[56,13],[75,19],[88,33],[92,50],[84,67],[69,79],[45,84],[25,79],[12,65]].map(pos);
  polygon(edge.map(([x,y])=>[x,y+9]),colors[district][1]);
  polygon(edge,colors[district][0]);
  ground(cx,cy,53,17,colors[district]);
  trail([...loop,loop[0]]);
 }
 for(const {id,points} of stops){
  const pins=harbor?points.slice(-1):points;
  pins.forEach((point,index)=>{
   const [x,y]=pos(point);
   const lit=point===active;
   landmark(x-6,y-6,id,colors[id],harbor&&id==='oalmr'?1:index,lit);
   if(id!=='hkonnect'){
    tree(x+20,y-4,['#7c987a','#526a67','#afab83'],true);
    block(x+6,y+3,5,2,'#d09887');
   }
   block(x+19,y-8,2,8,'#59475d');block(x+18,y-10,4,3,lit?'#fff3c4':'#a68e95');
  });
 }
 if(!harbor){
  for(const [dx,dy] of [[-22,-7],[15,-5],[-30,10]]){
   tree(cx+dx,cy+dy,['#789279','#52676a','#a6aa7e'],true);
  }
 }
}

function paintAvatar(canvas){
 const palette={o:'#352b43',h:'#50384c',l:'#785264',s:'#efbd97',e:'#513b4d',c:'#8ba99e',a:'#c0c7a9',b:'#635476',p:'#d5a08e'};
 const rows=[
  '...oooooo...',
  '..ohllllho..',
  '.ohhhhhhhho.',
  '.ohhssshhho.',
  '.ohseseshho.',
  '.ohssssshho.',
  '.ohhssshhho.',
  '.ohhccchhho.',
  '.ohcacaccho.',
  '.ohccccccco.',
  '.ohcaaaccao.',
  '..occcccco..',
  '...obbbbo...',
  '...obobbo...',
  '...op.opo...',
  '...oo.ooo...'
 ];
 const ctx=canvas.getContext('2d');
 rows.forEach((row,y)=>Array.from(row).forEach((pixel,x)=>{
  if(pixel=='.')return;
  ctx.fillStyle=palette[pixel];
  ctx.fillRect(x,y,1,1);
 }));
}

applyLanguage();
paintAvatar(walker.querySelector('canvas'));
placeWalker(central); walk(0,false);route();window.addEventListener('hashchange',()=>route());
